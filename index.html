<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <h1>Recettes de cuisine</h1>
       
        <!--Formulaire de récupération de la recette-->
        <div >
            <form action="" id="form-recette" class="formulaire">
                <label for="nom">Nom du plat</label>
                <input type="text" name="nom" id="nom" placeholder="Entrer le nom de votre plat" class="input">
                <label for="recette">Recette</label>
                <!-- <input type="text" name="recette" id="recette" placeholder="Entrer la recette"> -->
                <textarea class="textarea" id="recette" name="recette" placeholder="Entrer votre recette"></textarea>
                <label for="plat">Plat</label>
                <select name="plat" id="plat" class="select">
                    <option value="Entrée">Entrée</option>
                    <option value="Plat de résistance">Plat de résistance</option>
                    <option value="Dessert">Dessert</option>
                </select>
                <div class="btn">
                    <button type="submit" id="btn-form">Enregistrer</button>
                </div>
            </form>
        </div>

        <!--Liste des recettes-->
    <div class="recette">
    <div id="afficher-recette"></div>
</div>



</body>
</html>
