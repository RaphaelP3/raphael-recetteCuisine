<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <h1>Recettes de cuisine</h1>
       
        <!--Formulaire de récupération de la recette-->
        <div>
            <form action="" id="form-recette">
                <label for="nom">Nom du plat</label>
                <input type="text" name="nom" id="nom" placeholder="Entrer le nom de la recette">
                <label for="recette">Recette</label>
                <input type="text" name="recette" id="recette" placeholder="Entrer la recette">
                <button id="btn-form">Enregistrer</button>
            </form>
        </div>

        <!--Liste des recettes-->
        <div>
            <div id="result"></div>
        </div>



</body>
</html>
